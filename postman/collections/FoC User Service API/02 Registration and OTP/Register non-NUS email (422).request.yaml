$kind: http-request
name: Register non-NUS email -> 422
description: "Registration is restricted to @u.nus.edu addresses; any other domain is rejected with 422."
url: "{​{baseUrl}}/api/users/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "someone@gmail.com",
      "password": "Passw0rd1",
      "display_name": "Outsider"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('non-NUS email rejected (422)', function () {
          pm.response.to.have.status(422);
      });
    language: text/javascript
order: 1300
