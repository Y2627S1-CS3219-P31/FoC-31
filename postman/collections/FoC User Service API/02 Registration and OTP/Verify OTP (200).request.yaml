$kind: http-request
name: Verify OTP -> 200
description: "Verify the emailed OTP for clientEmail. With OTP_DEV_MODE=true the code is printed in `docker compose logs user-service` (line 'OTP_DEV_MODE active: verification code for ...'). Copy it into the otpCode environment variable before sending."
url: "{​{baseUrl}}/api/users/otp/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{​{clientEmail}}",
      "code": "{​{otpCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('verify email OTP (200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('verified true', function () {
          pm.expect(pm.response.json().verified).to.eql(true);
      });
    language: text/javascript
order: 1100
