$kind: http-request
name: Wrong password -> 401
description: "A valid email with an incorrect password is rejected with 401 invalid credentials."
url: "{​{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{​{adminEmail}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('wrong password (401)', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1200
