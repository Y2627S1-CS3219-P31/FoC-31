$kind: http-request
name: Login admin -> 200 (save adminToken)
description: "Authenticate the bootstrap admin and store the JWT as adminToken. Every admin-only request in this collection uses Bearer {​{adminToken}}. Run this first."
url: "{​{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{​{adminEmail}}",
      "password": "{​{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('admin login (200)', function () {
          pm.response.to.have.status(200);
      });
      var b = pm.response.json();
      pm.test('bearer token issued', function () {
          pm.expect(b.token_type).to.eql('bearer');
          pm.expect(b).to.have.property('access_token');
          pm.expect(b).to.have.property('expires_in');
      });
      pm.environment.set('adminToken', b.access_token);
    language: text/javascript
order: 1000
