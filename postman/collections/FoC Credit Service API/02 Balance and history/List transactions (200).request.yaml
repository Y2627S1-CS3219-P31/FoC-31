$kind: http-request
name: List transactions -> 200
description: "Return a user's signed credit transaction history (newest first). Self-or-admin. Query params: limit (1-200, default 50), offset (>=0)."
url: "{​{baseUrl}}/api/credits/{​{clientUserId}}/transactions?limit=50&offset=0"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{​{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('transactions returned (200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('response is an array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 1100
