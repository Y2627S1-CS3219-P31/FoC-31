$kind: http-request
name: Wrong password -> 401
description: "D2 User pt2: invalid credentials return 401 (indistinguishable from unknown-email to avoid enumeration)."
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{clientEmail}}",
      "password": "WrongPass9"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt2: wrong password rejected (401)', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
