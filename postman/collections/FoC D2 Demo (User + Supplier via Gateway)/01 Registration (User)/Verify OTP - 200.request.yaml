$kind: http-request
name: Verify OTP -> 200
description: "D2 User pt1: verify the emailed OTP. With OTP_DEV_MODE=true the code is printed in `docker compose logs user-service` (line 'OTP_DEV_MODE active: verification code for ...'). Copy it into the `otpCode` environment variable before sending."
url: "{{baseUrl}}/api/users/otp/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{clientEmail}}",
      "code": "{{otpCode}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt1: verify email OTP (200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('verified == true', function () {
          pm.expect(pm.response.json().verified).to.eql(true);
      });
    language: text/javascript
order: 2000
