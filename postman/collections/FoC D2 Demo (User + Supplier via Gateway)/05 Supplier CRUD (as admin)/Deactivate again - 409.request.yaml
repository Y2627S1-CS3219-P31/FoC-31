$kind: http-request
name: Deactivate again -> 409
description: "D2 Supplier pt1: deactivating an already-deactivated supplier is a 409 conflict."
url: "{{baseUrl}}/api/suppliers/{{supplierId}}/deactivate"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 Supplier pt1: double deactivate (409)', function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 10000
