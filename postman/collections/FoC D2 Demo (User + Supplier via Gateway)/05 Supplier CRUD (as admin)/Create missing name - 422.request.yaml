$kind: http-request
name: Create missing name -> 422
description: "D2 Supplier pt1: name is mandatory; omitting it is 422."
url: "{{baseUrl}}/api/suppliers"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "category": "Food",
      "building": "Demo Hall"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 Supplier pt1: missing name (422)', function () {
          pm.response.to.have.status(422);
      });
    language: text/javascript
order: 3000
