$kind: http-request
name: Create invalid category -> 422
description: "D2 Supplier pt1: category must be one of the locked enum values; anything else is 422."
url: "{{baseUrl}}/api/suppliers"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Bad Category",
      "category": "Groceries",
      "building": "Demo Hall"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 Supplier pt1: bad category (422)', function () {
          pm.response.to.have.status(422);
      });
    language: text/javascript
order: 2000
