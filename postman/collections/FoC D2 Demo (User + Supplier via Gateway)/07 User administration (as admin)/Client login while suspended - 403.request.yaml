$kind: http-request
name: Client login while suspended -> 403
description: "D2 User pt4: a suspended account can no longer authenticate; login fails closed with 403 even with the correct password."
url: "{{baseUrl}}/api/users/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{clientEmail}}",
      "password": "{{clientPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt4: suspended login blocked (403)', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000
