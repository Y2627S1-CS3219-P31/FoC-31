$kind: http-request
name: Admin suspend self -> 400
description: "D2 User pt4: an admin suspending its own account is rejected with 400 (self-suspension guard). adminUserId is resolved by the pre-request script from /api/users/me."
url: "{{baseUrl}}/api/users/admin/{{adminUserId}}/suspend"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt4: admin cannot suspend self (400)', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
