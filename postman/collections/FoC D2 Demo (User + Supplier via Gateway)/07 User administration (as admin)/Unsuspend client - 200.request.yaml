$kind: http-request
name: Unsuspend client -> 200
description: "D2 User pt4: admin lifts the suspension; the client can authenticate again."
url: "{{baseUrl}}/api/users/admin/{{clientUserId}}/unsuspend"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt4: unsuspend client (200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('is_suspended == false', function () {
          pm.expect(pm.response.json().is_suspended).to.eql(false);
      });
    language: text/javascript
order: 5000
