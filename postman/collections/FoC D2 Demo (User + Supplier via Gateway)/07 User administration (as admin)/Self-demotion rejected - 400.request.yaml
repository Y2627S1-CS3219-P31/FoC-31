$kind: http-request
name: Self-demotion rejected -> 400
description: "D2 User pt4 (role-change guard): an admin demoting itself is rejected with 400. adminUserId is set by the pre-request script."
url: "{{baseUrl}}/api/users/admin/{{adminUserId}}/role"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "role": "client"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 User pt4: self-demotion rejected (400)', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
