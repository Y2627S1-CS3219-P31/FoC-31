$kind: http-request
name: GET /health (gateway)
description: "D2 System: liveness of the API Gateway, the only public entry point."
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('D2 System: gateway is up (200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('body status == ok', function () {
          pm.expect(pm.response.json().status).to.eql('ok');
      });
    language: text/javascript
order: 1000
