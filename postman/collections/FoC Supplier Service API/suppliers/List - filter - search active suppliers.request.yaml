$kind: http-request
name: List / filter / search active suppliers
description: Lists active suppliers. Deactivated suppliers are excluded (F1.4). Returns an empty list (not 404) when nothing matches (F1.4.1, F2.2.3).
url: "{{baseUrl}}/api/suppliers?category=Printing&category=Food&zone=string&q=string&page=1&page_size=20&sort=name&order=asc&include_inactive=false"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: category
    value: Printing
    disabled: false
    description: Filter by one or more categories (F2.1.1).
    $type: array
  - key: category
    value: Food
    disabled: false
    description: Filter by one or more categories (F2.1.1).
  - key: zone
    value: string
    disabled: false
    description: Filter by campus zone/location (F2.1.2).
    $type: string
  - key: q
    value: string
    disabled: false
    description: Case-insensitive keyword search over name + location (F2.2).
    $type: string
  - key: page
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: page_size
    value: "20"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: sort
    value: name
    disabled: false
    description: Field to sort by (server-side, over the whole result set).
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "name",
            "enum": [
              "name",
              "category",
              "building"
            ]
          }
        }
      }
  - key: order
    value: asc
    disabled: false
    description: Sort direction.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "asc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
  - key: include_inactive
    value: "false"
    disabled: false
    description: Admin only. When true, deactivated suppliers are included in the results. Ignored (treated as false) for client callers.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "boolean",
            "default": false
          }
        }
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/List - filter - search active suppliers.resources/examples
order: 1000
