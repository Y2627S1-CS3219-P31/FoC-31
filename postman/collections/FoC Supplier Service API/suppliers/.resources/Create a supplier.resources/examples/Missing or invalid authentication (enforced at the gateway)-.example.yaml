$kind: http-example
name: Missing or invalid authentication (enforced at the gateway).
request:
  url: "{{baseUrl}}/suppliers"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-User-Role
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "category": "Printing",
        "building": "string",
        "floor": "string",
        "locationDescription": null,
        "latitude": null,
        "longitude": -41.72493428359462,
        "startingTime": "20:46",
        "closingTime": "20:52",
        "imageUrl": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "unauthorized",
        "message": "Authentication required."
      }
    $type: |-
      {
        "description": "Shared error shape (foc_shared.errors.ErrorEnvelope).",
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "validation_error",
              "bad_request",
              "unauthorized",
              "forbidden",
              "not_found",
              "conflict"
            ],
            "description": "Stable machine-readable code."
          },
          "message": {
            "type": "string",
            "description": "Human-readable explanation."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000
