$kind: http-example
name: Validation failed.
request:
  url: "{{baseUrl}}/suppliers/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-User-Role
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: Supplier identifier.
  body:
    type: json
    content: |-
      {
        "name": "string",
        "category": "Shopping",
        "building": "string",
        "floor": "string",
        "locationDescription": null,
        "latitude": null,
        "longitude": null,
        "startingTime": "23:45",
        "closingTime": "03:27",
        "imageUrl": null
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "validation_error",
        "message": "Field 'category' is not in the allowed set."
      }
    $type: |-
      {
        "description": "Shared error shape (foc_shared.errors.ErrorEnvelope).",
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "validation_error",
              "bad_request",
              "unauthorized",
              "forbidden",
              "not_found",
              "conflict"
            ],
            "description": "Stable machine-readable code."
          },
          "message": {
            "type": "string",
            "description": "Human-readable explanation."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 5000
