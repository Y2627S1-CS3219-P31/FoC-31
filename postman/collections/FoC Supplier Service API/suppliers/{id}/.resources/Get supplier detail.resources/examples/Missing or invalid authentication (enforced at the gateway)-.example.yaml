$kind: http-example
name: Missing or invalid authentication (enforced at the gateway).
request:
  url: "{{baseUrl}}/suppliers/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: Supplier identifier.
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "unauthorized",
        "message": "Authentication required."
      }
    $type: |-
      {
        "description": "Shared error shape (foc_shared.errors.ErrorEnvelope).",
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "validation_error",
              "bad_request",
              "unauthorized",
              "forbidden",
              "not_found",
              "conflict"
            ],
            "description": "Stable machine-readable code."
          },
          "message": {
            "type": "string",
            "description": "Human-readable explanation."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000
