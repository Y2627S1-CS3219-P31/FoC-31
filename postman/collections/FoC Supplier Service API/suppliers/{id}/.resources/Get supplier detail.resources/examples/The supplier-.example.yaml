$kind: http-example
name: The supplier.
request:
  url: "{{baseUrl}}/suppliers/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: Supplier identifier.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "name": "string",
        "category": "Printing",
        "building": "string",
        "active": true,
        "floor": null,
        "locationDescription": "string",
        "latitude": null,
        "longitude": 64.38118030986291,
        "startingTime": "20:14",
        "closingTime": "09:27",
        "imageUrl": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "category": {
            "type": "string",
            "enum": [
              "Food",
              "Food/Coffee",
              "Shopping",
              "Printing"
            ],
            "description": "Predefined supplier category (F1.1.2). These four values are canonical and match the seed dataset's Type column exactly."
          },
          "building": {
            "type": "string"
          },
          "floor": {
            "type": [
              "string",
              "null"
            ]
          },
          "locationDescription": {
            "type": [
              "string",
              "null"
            ]
          },
          "latitude": {
            "type": [
              "number",
              "null"
            ],
            "minimum": -90,
            "maximum": 90
          },
          "longitude": {
            "type": [
              "number",
              "null"
            ],
            "minimum": -180,
            "maximum": 180
          },
          "startingTime": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "closingTime": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
          },
          "imageUrl": {
            "type": [
              "string",
              "null"
            ]
          },
          "active": {
            "type": "boolean",
            "description": "true = active, false = deactivated (F3.1.1)."
          }
        },
        "required": [
          "id",
          "name",
          "category",
          "building",
          "active"
        ]
      }
order: 1000
