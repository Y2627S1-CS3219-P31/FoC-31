# AI-influenced: implemented with AI assistance; see ai/usage-log.md.
# Prometheus for the credit-service observability demo.
#
#   docker compose --profile observability up -d prometheus grafana
#
# Everything here is internal to the compose network; nothing is exposed to the
# browser except the two published ports (Prometheus 9090, Grafana 3000).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The service never publishes /metrics through the API gateway: Prometheus
  # talks to it over foc-net, so the endpoint stays internal.
  - job_name: credit-service
    metrics_path: /metrics
    static_configs:
      - targets: ["credit-service:8000"]
        labels:
          service: credit-service

  # Broker-side metrics (queue depth, unacked, consumer count). RabbitMQ does
  # not produce application traces; this is the broker's own view of the async
  # path, and it complements the application-side consumer gauges.
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq
