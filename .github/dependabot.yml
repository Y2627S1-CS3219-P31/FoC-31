version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /api-gateway
      - /user-service
      - /supplier-service
      - /order-service
      - /credit-service
      - /notification-service
      - /shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /api-gateway
      - /user-service
      - /supplier-service
      - /order-service
      - /credit-service
      - /notification-service
      - /frontend
      - /infra/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
