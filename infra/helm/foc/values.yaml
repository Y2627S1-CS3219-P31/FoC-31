global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  backup:
    enabled: true
    schedule: "30 1 * * *"
    timeZone: Asia/Singapore
    bucket: ""
    staticCredentialsSecret: ""
    region: ap-southeast-1
    image:
      repository: foc/pg-backup
      tag: dev
    s3EndpointUrl: ""

createNamespaces: true

smokeTest:
  enabled: false

namespaces:
  - foc-supplier
  - foc-user
  - foc-credit
  - foc-order
  - foc-notification
  - foc-messaging
  - foc-gateway
  - foc-frontend
