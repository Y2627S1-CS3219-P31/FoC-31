namespace: foc-credit
replicas: 1
port: 8000
healthPath: /health

image:
  repository: foc/credit-service
  tag: dev

env:
  LOG_LEVEL: info

secretEnv:
  - name: DATABASE_URL
    secret: credit-secrets
    key: DATABASE_URL
  - name: RABBITMQ_URL
    secret: credit-secrets
    key: RABBITMQ_URL

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 320Mi

postgres:
  name: credit-db
  dbName: credit_db
  secret: credit-secrets
  image: postgres:16-alpine
  sharedBuffers: 128MB
  maxConnections: 50
  storage: 1Gi
  storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 256Mi
