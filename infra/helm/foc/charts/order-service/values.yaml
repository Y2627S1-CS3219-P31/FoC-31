namespace: foc-order
replicas: 1
port: 8000
healthPath: /health

image:
  repository: foc/order-service
  tag: dev

env:
  LOG_LEVEL: info
  SUPPLIER_SERVICE_URL: http://supplier-service.foc-supplier.svc.cluster.local:8000
  CREDIT_SERVICE_URL: http://credit-service.foc-credit.svc.cluster.local:8000

secretEnv:
  - name: DATABASE_URL
    secret: order-secrets
    key: DATABASE_URL

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

postgres:
  name: order-db
  dbName: order_db
  secret: order-secrets
  image: postgres:16-alpine
  sharedBuffers: 128MB
  maxConnections: 50
  storage: 1Gi
  storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 256Mi
