# REPLACE_ME hosts and origins are filled by scripts/render-ec2-values.sh after terraform apply.
# Image tags (global.backup.image.tag and each <svc>.image.tag) are managed by CI; do not edit by hand.
createNamespaces: false
smokeTest:
  enabled: true
global:
  imageRegistry: ghcr.io/y2627s1-cs3219-p31
  imagePullPolicy: IfNotPresent
  backup:
    image:
      repository: pg-backup
      tag: latest
    s3EndpointUrl: ""

supplier-service:
  image: { repository: supplier-service, tag: latest }
user-service:
  image: { repository: user-service, tag: latest }
credit-service:
  image: { repository: credit-service, tag: latest }
order-service:
  image: { repository: order-service, tag: latest }
notification-service:
  image: { repository: notification-service, tag: latest }

api-gateway:
  image: { repository: api-gateway, tag: latest }
  env:
    CORS_ALLOWED_ORIGINS: https://REPLACE_ME.nip.io
  ingress:
    host: REPLACE_ME.nip.io
    tls:
      enabled: true
      issuer: letsencrypt-prod

frontend:
  image: { repository: frontend, tag: latest }
  env:
    API_BASE_URL: https://REPLACE_ME.nip.io
  ingress:
    host: REPLACE_ME.nip.io
    tls:
      enabled: true
      issuer: letsencrypt-prod
