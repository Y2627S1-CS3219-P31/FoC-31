apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Y2627S1-CS3219-P31/FoC-31.git
    targetRevision: main
    path: infra/helm/foc
    helm:
      releaseName: foc
      valueFiles:
        - values.yaml
        - values-ec2.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
