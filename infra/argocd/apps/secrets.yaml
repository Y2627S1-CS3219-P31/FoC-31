apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/Y2627S1-CS3219-P31/FoC-31.git
    targetRevision: main
    path: infra/k8s/sealed
    directory:
      recurse: false
      exclude: "{pub-cert.pem,README.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
