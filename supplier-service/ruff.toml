# Ruff lint/format config (tooling only; deps live in requirements.txt).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: allow the `str, Enum` idiom (widely used; kept for readability).
ignore = ["UP042"]

[lint.isort]
known-first-party = ["app", "foc_shared"]

[lint.flake8-bugbear]
# FastAPI dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
